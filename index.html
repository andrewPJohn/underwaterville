<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Underwaterville: a flood-manager game for first-year engineering students.">
<style>[hidden]{display:none!important}</style>
<title>Underwaterville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: a council flood desk. The town map is the hero, decisions sit in four lanes beside it, and money runs along the bottom like a till. */
:root{
  --bg:#edf2f3; --surface:#ffffff; --surface-2:#f5f8f8; --sunk:#e3eaec;
  --ink:#132a35; --ink-2:#4a6170; --ink-3:#7d909a; --line:#d4dfe2; --line-2:#b5c6cc;
  --water:#2b7bb9; --water-soft:#a9cfea; --water-deep:#1b5c8f;
  --land:#dfe8d0; --land-2:#cfdcbc; --field:#e8e2c8; --road:#98a5ac; --house:#ffffff; --house-line:#4a6170; --tree:#7fae7a;
  --know:#5b4fc7; --protect:#9a6b1f; --plan:#2f8a57; --prepare:#d9601a;
  --know-t:#ecebfb; --protect-t:#f6eddc; --plan-t:#e2f2e8; --prepare-t:#fcebdf;
  --hivis:#f2bd0c; --hivis-t:#fff4cc; --hivis-ink:#6b5200;
  --danger:#c0392b; --danger-t:#fbe7e4; --warn:#c77a0a; --warn-t:#fcf0db; --good:#23864b; --good-t:#e1f2e7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --masthead:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --r:10px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a20; --surface:#14242c; --surface-2:#1a2d36; --sunk:#0f1e25;
  --ink:#e4edf0; --ink-2:#a8bbc4; --ink-3:#7b919b; --line:#253a44; --line-2:#36505d;
  --water:#4aa0de; --water-soft:#2a5c80; --water-deep:#7cc0f0;
  --land:#1c3027; --land-2:#24392d; --field:#2c3426; --road:#5b6c75; --house:#d5e0e4; --house-line:#14242c; --tree:#4e8a5a;
  --know:#9c92f2; --protect:#d9a352; --plan:#56c487; --prepare:#ff8c42;
  --know-t:#262350; --protect-t:#3a2c14; --plan-t:#173a27; --prepare-t:#41230f;
  --hivis:#f2c94c; --hivis-t:#3b3210; --hivis-ink:#f6dc85;
  --danger:#ff6f5e; --danger-t:#43201c; --warn:#f0aa3c; --warn-t:#3d2b10; --good:#5fca8d; --good-t:#173a27; --on-accent:#0d1a20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a20; --surface:#14242c; --surface-2:#1a2d36; --sunk:#0f1e25;
  --ink:#e4edf0; --ink-2:#a8bbc4; --ink-3:#7b919b; --line:#253a44; --line-2:#36505d;
  --water:#4aa0de; --water-soft:#2a5c80; --water-deep:#7cc0f0;
  --land:#1c3027; --land-2:#24392d; --field:#2c3426; --road:#5b6c75; --house:#d5e0e4; --house-line:#14242c; --tree:#4e8a5a;
  --know:#9c92f2; --protect:#d9a352; --plan:#56c487; --prepare:#ff8c42;
  --know-t:#262350; --protect-t:#3a2c14; --plan-t:#173a27; --prepare-t:#41230f;
  --hivis:#f2c94c; --hivis-t:#3b3210; --hivis-ink:#f6dc85;
  --danger:#ff6f5e; --danger-t:#43201c; --warn:#f0aa3c; --warn-t:#3d2b10; --good:#5fca8d; --good-t:#173a27; --on-accent:#0d1a20;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:28px} h3{font-size:20px}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--ink-3);display:block;margin-top:-2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabbtn{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--ink-2);cursor:pointer}
.tabbtn:hover{background:var(--surface-2);color:var(--ink)}
.tabbtn[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main.wrap{padding-block:20px 120px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.primary:hover{opacity:.9}
.btn.go{background:var(--hivis);color:#1d1600;border-color:var(--hivis);font-weight:600}
.btn.big{font-size:17px;padding:12px 22px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.hv{background:var(--hivis-t);color:var(--hivis-ink)} .pill.dg{background:var(--danger-t);color:var(--danger)} .pill.gd{background:var(--good-t);color:var(--good)} .pill.wn{background:var(--warn-t);color:var(--warn)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
input[type=text],input[type=number],textarea{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:12px}
.err{color:var(--danger);font-size:13px}
svg text{font-family:var(--body)}

/* tours */
.tour{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.tour{grid-template-columns:minmax(0,1fr)}}
.tour-vis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:300px}
.tour-text{padding:6px 4px;display:flex;flex-direction:column;gap:14px}
.tour-text h2{font-size:clamp(30px,3.4vw,46px);font-weight:700}
.tour-text .lead{font-size:18px;line-height:1.55;max-width:46ch}
.tour-text ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:48ch}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.fact b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.fact span{font-size:12px;color:var(--ink-2)}
.tour-nav{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.keyhint{font-size:12px;color:var(--ink-3)}
.ctl-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.ctl-inline input[type=range]{flex:1;min-width:160px}

/* segmented + toggles + sliders */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--lane,var(--ink));color:#fff}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
input[type=range]{accent-color:var(--lane,var(--ink));width:100%}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked + i{background:var(--lane,var(--ink))}
.sw input:checked + i::after{transform:translateX(18px)}
.sw input:disabled + i{opacity:.5}
.sw input:focus-visible + i{outline:3px solid var(--hivis);outline-offset:2px}

/* play */
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.modecard{border:2px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.modecard h3{font-size:26px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.stepper span{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;padding:4px 12px;border-radius:999px;background:var(--sunk);color:var(--ink-3)}
.stepper span.done{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.stepper span.on{background:var(--ink);color:var(--bg)}
.roundhead{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.roundhead h2{font-size:clamp(28px,3vw,40px);font-weight:700}
.gauges{display:flex;gap:10px;flex-wrap:wrap}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:140px}
.gauge .lab{font-size:12px;color:var(--ink-2)}
.gauge .val{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%}

/* herald */
.herald{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px 18px;margin-bottom:16px}
.herald .mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:3px double var(--line-2);padding-bottom:6px;margin-bottom:12px;flex-wrap:wrap}
.herald .mast b{font-family:var(--masthead);font-weight:400;font-size:clamp(26px,3vw,38px);line-height:1}
.herald .mast span{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--ink-2)}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.story{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.story h4{margin:0;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.story p{font-size:14px;color:var(--ink-2)}
.story.decide{background:var(--hivis-t);border:2px solid var(--hivis)}
.story.decide.done{background:var(--surface-2);border:2px solid var(--good)}
.story .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.story .opts button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.story .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.board{grid-template-columns:minmax(0,1fr)}}
.mapcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:1050px){.mapcard{position:static}}
.mapcard .dfl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.testflood{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.testflood .out{font-size:13px;color:var(--ink-2);margin-top:4px;min-height:40px}
.lanes{display:flex;flex-direction:column;gap:14px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lane > header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.lane > header h3{font-size:22px;color:var(--lane)}
.lane > header span{font-size:13px;color:var(--ink-2)}
.lane > header .lanecost{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink)}
.ctrl{border-top:1px solid var(--line);padding:10px 0 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.ctrl:first-of-type{border-top:0}
.ctrl .lab{font-weight:500;font-size:14px}
.ctrl .val{font-size:13px;color:var(--ink-2);grid-column:1}
.ctrl .tag{grid-column:2;grid-row:1;font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.ctrl .tag.cost{background:var(--lane-t,var(--sunk));color:var(--lane)}
.ctrl .tag.plus{background:var(--good);color:var(--surface);font-weight:500}
.ctrl .tag:empty{display:none}
.ctrl .input{grid-column:1 / -1}
.ctrl.locked{opacity:.55}
.ctrl .lock{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.ctrl .help{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.out-line{font-size:14px;background:var(--lane-t);color:var(--ink);border-radius:8px;padding:8px 10px;margin-top:8px}

/* till */
.till{position:sticky;bottom:0;z-index:15;margin-top:16px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px 14px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(10,30,40,.08)}
.till .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr) minmax(0,1.1fr);gap:14px;align-items:center}
@media (max-width:1050px){.till .cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.till .lab{font-size:12px;color:var(--ink-2)}
.till .val{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:4px}
.till .why{font-size:13px;color:var(--danger);margin-top:4px}
.till .why.ok{color:var(--ink-2)}
details.budget summary{cursor:pointer;font-size:13px;color:var(--ink-2);margin-top:6px}
.ledger{font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;margin-top:6px;max-width:440px}
.ledger .tot{font-weight:600;border-top:1px solid var(--line);padding-top:2px}

/* reveal */
.reveal{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.reveal{grid-template-columns:minmax(0,1fr)}}
.bigyear{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.bigyear .y{font-family:var(--display);font-weight:700;font-size:56px;line-height:1}
.bigyear .l{font-family:var(--mono);font-size:34px;font-weight:500}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:600px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.counter{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.counter b{display:block;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.counter span{font-size:12px;color:var(--ink-2)}
.ticker{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.ticker li{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.ticker li.bad{background:var(--danger-t);border-color:transparent}
.ticker li.dmg{background:var(--warn-t);border-color:transparent}
.ticker li .yr{font-family:var(--mono);font-weight:500;margin-right:8px}
.supp{display:flex;flex-direction:column;gap:6px}
.supp .r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.supp .bar{position:relative;height:12px;background:var(--sunk);border-radius:3px}
.supp .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.supp .r .n{font-family:var(--mono);text-align:right}

/* results */
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.scores{grid-template-columns:repeat(2,minmax(0,1fr))}}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.score .lab{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.score .v{font-family:var(--display);font-weight:700;font-size:36px;line-height:1}
.score .live,.score .cmp{font-size:13px;color:var(--ink-2)}
.score .cmp b{font-weight:600}
.better{color:var(--good)} .worse{color:var(--danger)}
.pathway{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:0;overflow-x:auto}
.pathway .h{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 8px;border-bottom:1px solid var(--line)}
.pathway .lane-name{font-family:var(--display);font-weight:700;font-size:20px;padding:10px 8px;color:var(--lane);border-bottom:1px solid var(--line)}
.pathway .cell{position:relative;padding:10px 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-width:180px}
.pathway .cell::before{content:"";position:absolute;left:0;right:0;top:21px;height:4px;background:var(--lane);opacity:.25}
.station{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.3;background:var(--surface);border:2px solid var(--lane);border-radius:12px;padding:2px 9px}
.station.quiet{border-style:dashed;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* facilitator */
.fac{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.fac{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile.hit{border:2px solid var(--danger)}
.tile header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile header b{font-family:var(--display);font-size:20px}
.tile .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:12px;color:var(--ink-2);margin-top:4px}
.tile .nums b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.notes{max-width:76ch;display:flex;flex-direction:column;gap:14px}
.notes h3{margin-top:10px}
.copybox{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:8px;padding:10px;user-select:all;max-height:120px;overflow:auto}
.zone{cursor:pointer}
.zone:hover .zrect{stroke:var(--ink);stroke-width:2}
/* v3 additions */
.playbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.playbar .stepper{margin:0}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.gauge .val small,.bigsup small,.score .v small{font-size:.5em;color:var(--ink-3);font-weight:600}
.bigsup{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.banner{background:var(--hivis-t);border:2px solid var(--hivis);color:var(--ink);border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:14px}
.banner.ok{background:var(--good-t);border-color:var(--good)}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer}
.ctrl .input{display:flex;gap:10px;align-items:center}
.ctrl .input input[type=range]{flex:1;min-width:0}
.ctrl .input .num{min-width:62px;text-align:right;font-size:13px;color:var(--ink)}
.ctrl .tag.zero{background:transparent;color:var(--ink-3)}
.ctrl.locked .seg button,.ctrl.locked input{cursor:not-allowed}
details.mini{margin:0 0 6px}
details.mini summary{cursor:pointer;font-size:13px;color:var(--know)}
details.mini[open] summary{margin-bottom:6px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.fld input{font-size:16px;color:var(--ink)}
.modecard p{max-width:52ch}
.fc{display:flex;flex-direction:column;gap:1px;font-size:13px;transition:opacity .15s}
.fc b{font-family:var(--mono);font-weight:500}
.fc .faint{font-size:11.5px;line-height:1.3;margin-top:2px}
.fc.stale{opacity:.45}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.till .val .worse{color:var(--danger)}
.flash{animation:flash .8s ease 2}
@keyframes flash{50%{background:var(--danger-t)}}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:flex;flex-direction:column;gap:18px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start}
.steps>li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--hivis);color:#1d1600;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.receipt{font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.plainlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bignum{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;margin:8px 0 2px;letter-spacing:.02em}
.grouplist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.grouplist li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grouplist .x{margin-left:auto;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1}
.tile.bau{border-style:dashed}
table.t tr.bau td{color:var(--ink-2);font-style:italic}
.notes p,.notes li{line-height:1.6}
.notes ul{margin:0;padding-left:20px}
.counter b.worse{color:var(--danger)}
@media (max-width:700px){
  .till{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .till .cols{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .till .val{font-size:20px}
  .till .fccol{display:none}
  .till .lockcol{grid-column:1 / -1}
  .till .lockcol .btn.big{padding:9px 16px;font-size:16px}
  .brand span{display:none}
  .brand b{font-size:21px}
  .tabbtn{font-size:15px;padding:6px 8px}
  .top .wrap{gap:6px;padding-block:6px}
  .bigyear .y{font-size:42px}.bigyear .l{font-size:26px}
  .top{position:static}
  .tour-vis{min-height:0}
}
/* v3.1 additions */
.till{padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.tillrow{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.tcell{min-width:96px}
.tcell .lab{font-size:11.5px;color:var(--ink-2)}
.tcell .val{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05}
.tcell .meter,.tcell .mix{margin-top:3px;height:5px}
.tcell.grow{flex:1;min-width:160px}
.tcell.grow .why{margin-top:0}
.tillrow #lockBtn{padding:10px 18px;font-size:16px}
.tilltog{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tillmore{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.fcbox{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.fcbox .lab{font-size:12px;color:var(--ink-2);margin-bottom:2px}
.fcbox .fc{flex-direction:row;flex-wrap:wrap;gap:2px 16px;font-size:14px}
.knock{font-size:13px;color:var(--ink-2);margin-top:6px;padding:0 2px}
.meter{position:relative}
.meter .floor{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--hivis-t)}}
input[type=range].pulse{border-radius:999px;animation:pulse 1.6s ease-in-out infinite}
details.history{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:6px 0 14px}
details.history > summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;color:var(--ink-2)}
details.history[open] > summary{margin-bottom:10px}
.minihead{font-family:var(--display);font-weight:600;font-size:16px;margin:12px 0 6px;color:var(--ink-2)}
.callout{margin-top:10px;background:var(--know-t);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink)}
.score.better{border-color:var(--good);background:linear-gradient(var(--good-t),var(--good-t)) top/100% 5px no-repeat,var(--surface)}
.score.worse{border-color:var(--danger);background:linear-gradient(var(--danger-t),var(--danger-t)) top/100% 5px no-repeat,var(--surface)}
.score .verdict{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-right:4px;background:var(--sunk);color:var(--ink-2)}
.score.better .verdict{background:var(--good);color:var(--surface)}
.score.worse .verdict{background:var(--danger);color:var(--surface)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.trio{grid-template-columns:minmax(0,1fr)}}
.trio-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);min-width:0}
.trio-name{font-family:var(--display);font-size:19px}
.nums3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;font-size:12px;color:var(--ink-2);margin-top:6px}
.nums3 b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink)}
.nums3 span{display:block;font-size:11px;color:var(--ink-3)}
table.t tr.cur td{background:var(--hivis-t)}
.station.flag{border-color:var(--danger);color:var(--danger)}
@media (max-height:820px) and (min-width:701px){.top{position:static}.mapcard{top:12px}}
@media (max-width:700px){.tcell .val{font-size:19px}.tillrow #lockBtn{flex:1}.tcell.grow{order:9;flex-basis:100%}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="38" viewBox="0 0 30 38" aria-hidden="true"><rect x="11" y="1" width="8" height="36" rx="1.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><g stroke="var(--ink)" stroke-width="1.4"><line x1="11" y1="7" x2="16" y2="7"/><line x1="11" y1="13" x2="19" y2="13"/><line x1="11" y1="19" x2="16" y2="19"/><line x1="11" y1="25" x2="19" y2="25"/><line x1="11" y1="31" x2="16" y2="31"/></g><path d="M0 24 Q7.5 20 15 24 T30 24 V38 H0Z" fill="var(--water)" opacity=".85"/></svg>
      <div><b>Underwaterville</b><span>A century of floods. Your town. Your call.</span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tabbtn" role="tab" data-tab="town" aria-selected="true">Meet the town</button>
      <button class="tabbtn" role="tab" data-tab="howto" aria-selected="false">How to play</button>
      <button class="tabbtn" role="tab" data-tab="play" aria-selected="false">Play</button>
      <button class="tabbtn" role="tab" data-tab="fac" aria-selected="false">Facilitator</button>
      <button class="tabbtn" role="tab" data-tab="notes" aria-selected="false">Model notes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-town" class="tab" aria-label="Meet the town"><div id="tourTown"></div></section>
  <section id="tab-howto" class="tab" aria-label="How to play" hidden><div id="tourHow"></div></section>
  <section id="tab-play" class="tab" aria-label="Play" hidden><div id="play"></div></section>
  <section id="tab-fac" class="tab" aria-label="Facilitator" hidden><div id="fac"></div></section>
  <section id="tab-notes" class="tab" aria-label="Model notes" hidden><div id="notes" class="notes"></div></section>
</main>

<script>
// ===== Underwaterville v3 model (pure functions, no DOM) =====
const UW = (() => {
  // ---------- RNG & helpers ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gevQ = (p, loc, sc, xi) => loc + (sc / xi) * (Math.pow(-Math.log(p), -xi) - 1);
  const gevF = (x, loc, sc, xi) => { const z = 1 + xi * (x - loc) / sc; return z <= 0 ? 0 : Math.exp(-Math.pow(z, -1 / xi)); };
  const r1 = v => Math.round(v * 10) / 10;
  function poissonInv(lam, u) { if (lam <= 0) return 0; let k = 0, p = Math.exp(-lam), F = p; while (u > F && k < 200) { k++; p *= lam / k; F += p; } return k; }

  // ---------- Hydroclimate (hidden truth) ----------
  const HYD = { loc_d: 2.5, sc_d: 0.75, loc_w: 3.3, sc_w: 0.95, xi: 0.08, pww: 0.85, pdd: 0.90, dl: 0.10, ds: 0.15, dx: 0.03, cap: 11.5 };
  const N_REP = 300, N_YR = 100, YEAR0 = 2026;
  const SEG = [[0, 33], [33, 66], [66, 100]];
  const ROUND_YEAR = [2026, 2059, 2092];
  function params(wet, t, tau) { const f = t / N_YR; return { loc: (wet ? HYD.loc_w : HYD.loc_d) * (1 - HYD.dl * tau * f), sc: (wet ? HYD.sc_w : HYD.sc_d) * (1 + HYD.ds * tau * f), xi: HYD.xi + HYD.dx * tau * f }; }
  function drawYear(r, wet, t, tau) { const p = params(wet, t, tau); return Math.min(gevQ(clamp(r(), 1e-6, 1 - 1e-6), p.loc, p.sc, p.xi), HYD.cap); }
  function triangular(u, a, c, b) { const F = (c - a) / (b - a); return u < F ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c)); }
  function buildEnsemble(seed = 20260930) {
    const r = mulberry32(seed), reps = [];
    for (let k = 0; k < N_REP; k++) {
      const tau = triangular(r(), 0.3, 1.0, 1.7); let wet = r() < 0.4;
      const L = new Float32Array(N_YR), W = new Float32Array(N_YR), D = new Float32Array(N_YR);
      for (let t = 0; t < N_YR; t++) { wet = wet ? (r() < HYD.pww) : (r() >= HYD.pdd); L[t] = drawYear(r, wet, t, tau); W[t] = r(); D[t] = r(); }
      reps.push({ tau, L, W, D });
    }
    return reps;
  }
  function buildRecord(seed = 20260945, n = 60) { const r = mulberry32(seed); let wet = r() < 0.4; const out = []; for (let t = 0; t < n; t++) { wet = wet ? (r() < HYD.pww) : (r() >= HYD.pdd); out.push(drawYear(r, wet, 0, 0)); } return out; }
  // True 1% AEP level in year t for drift tau (stationary mixture of wet/dry regimes)
  function trueQ(t, tau, aep = 0.01) {
    const pw = (1 - HYD.pdd) / ((1 - HYD.pww) + (1 - HYD.pdd));
    const w = params(true, t, tau), d = params(false, t, tau);
    let lo = 2, hi = 15; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; const F = pw * gevF(m, w.loc, w.sc, w.xi) + (1 - pw) * gevF(m, d.loc, d.sc, d.xi); if (F < 1 - aep) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  function gumbelFit(rec) {
    const s = [...rec].sort((a, b) => a - b), n = s.length, l1 = s.reduce((a, b) => a + b, 0) / n;
    let b1 = 0; for (let i = 0; i < n; i++) b1 += (i / (n - 1)) * s[i]; b1 /= n;
    const l2 = 2 * b1 - l1, beta = l2 / Math.LN2, mu = l1 - 0.5772 * beta;
    return { mu, beta, q: aep => mu - beta * Math.log(-Math.log(1 - aep)) };
  }
  function bootstrapQ(rec, aep, nb = 300, seed = 99) {
    const r = mulberry32(seed), n = rec.length, qs = [];
    for (let b = 0; b < nb; b++) { const s = []; for (let i = 0; i < n; i++) s.push(rec[Math.floor(r() * n)]); qs.push(gumbelFit(s).q(aep)); }
    qs.sort((a, b) => a - b); return { lo: qs[Math.floor(nb * 0.05)], hi: qs[Math.floor(nb * 0.95)] };
  }

  // ---------- Town ----------
  const ZONES = {
    riverside: { name: "Riverside", floor: 5.0, n: 200, value: 0.35, ppl: 2.5 },
    cbd: { name: "Town centre", floor: 5.8, n: 400, value: 0.90, ppl: 1.5 },
    suburbs: { name: "Suburbs", floor: 6.3, n: 900, value: 0.45, ppl: 2.5 },
    hillside: { name: "Hillside", floor: 7.0, n: 0, value: 0.50, ppl: 2.5, max: 900 },
  };
  const ALIGN = {
    none: { inside: [], len: 0, label: "No levee" },
    cbd: { inside: ["cbd"], len: 0.6, label: "Town centre" },
    cbdsub: { inside: ["cbd", "suburbs"], len: 1.0, label: "Centre + suburbs" },
    all: { inside: ["cbd", "suburbs", "hillside"], len: 1.5, label: "Whole town" },
  };
  const ALIGN_ORDER = ["none", "cbd", "cbdsub", "all"];
  const LEVEE_BASE = 5.5, BRIDGE = 5.8, BRIDGE_RAISED = 7.2, MAJOR = 5.5, MODERATE = 4.5, MINOR = 3.0;
  const COST = { leveeUnit: h => 4 * h + 5 * h * h, retrofit: 1.25, spillwayPerLen: 6, basinUnit: 12, bridge: 20, route: 12, buyback: 0.4, raise: 0.15, retreat: 0.35, fillPerHomeM: 0.02, grantPerHome: 0.02, warning: [0, 3, 6, 10], regional: 2, consult: 2, wardens: 2, maintFrac: 0.08 };
  const MONEY = { tranche: [50, 30, 30], ratesPerHome: 0.01, contribPerHome: [0.015, 0.02, 0.02], recoveryGrant: 10, councilShare: 0.05, councilShareCap: 20 };
  const WARN_REL = [0.35, 0.6, 0.75, 0.88];
  const WARN_NAME = ["Radio and word of mouth", "River gauges and SMS alerts", "Gauges, forecast model, alerts", "Full system: radar, model, door-knock teams"];
  const CLIM = { none: 0, low: 0.3, medium: 0.6, high: 1.1 }; // metres per century, from 2000
  const CLIM_NAME = { none: "Ignore climate change", low: "Low emissions (SSP1-2.6)", medium: "Medium emissions (SSP2-4.5)", high: "High emissions (SSP5-8.5)" };
  const REVISION = [1.0, 1.15, 1.3];
  const HORIZONS = [[2050, 2075, 2100], [2075, 2100, 2125], [2100, 2125, 2150]];
  const HOUSING = [1.0, 1.3, 1.6];
  function climateUplift(scen, year, k) { return scen === "none" ? 0 : CLIM[scen] * (year - 2000) / 100 * REVISION[k]; }
  function leveeCapital(align, crest) { return align === "none" ? 0 : ALIGN[align].len * COST.leveeUnit(Math.max(0, crest - LEVEE_BASE)); }
  function basinReduction(L, units) { if (!units) return 0; const f = L <= 7 ? 0.2 : L >= 9 ? 0.05 : 0.2 - 0.075 * (L - 7); return units * f; }
  const dmgFrac = d => d <= 0 ? 0 : Math.min(0.75, 0.2 + 0.3 * d);
  const MEM_FLOOR_DECAY = Math.pow(0.5, 1 / 25);
  // community support: each period starts halfway between 70 and where the last period ended
  const supportCarry = (prev, k) => k === 0 ? 70 : Math.round(70 + 0.5 * ((prev == null ? 70 : prev) - 70));

  // ---------- State ----------
  function initialState() {
    return { k: 0, align: "none", crest: 0, leveeCap: 0, spillway: false, basin: 0, bridge: false, route2: false, wardens: false, regional: false, code: false,
      rsBought: 0, rsRaised: 0, retreat: 0, grants: 0, hill: [], infill: [],
      M: 30, A: 20, MF: 0, support: 70, unspent: 0, spent: 0, spentByLane: [0, 0, 0, 0], dmg: 0, nbr: 0, lives: 0, lam: 0,
      record: null, last: null, events: null, maintDeferred: false };
  }
  // Cohorts of homes for a state + this round's plan fragments
  function cohorts(S, extra) {
    const c = [];
    const rsLeft = ZONES.riverside.n - S.rsBought - S.rsRaised;
    const g = S.grants / 100;
    if (rsLeft > 0) c.push({ z: "riverside", n: rsLeft, floor: 5.0, res: g });
    if (S.rsRaised > 0) c.push({ z: "riverside", n: S.rsRaised, floor: 6.3, res: g });
    c.push({ z: "cbd", n: ZONES.cbd.n, floor: 5.8, res: g });
    const subN = Math.round(ZONES.suburbs.n * (1 - S.retreat / 100));
    if (subN > 0) c.push({ z: "suburbs", n: subN, floor: 6.3, res: g });
    for (const h of S.infill) c.push({ z: "suburbs", n: h.n, floor: h.floor, res: h.res ? 1 : 0 });
    for (const h of S.hill) c.push({ z: "hillside", n: h.n, floor: h.floor, res: h.res ? 1 : 0 });
    if (extra) for (const e of extra) c.push(e);
    return c;
  }
  const hillBuilt = S => S.hill.reduce((a, h) => a + h.n, 0);
  const infillBuilt = S => S.infill.reduce((a, h) => a + h.n, 0);
  const homesTotal = S => cohorts(S).reduce((a, c) => a + c.n, 0);
  const peopleHoused = S => cohorts(S).reduce((a, c) => a + c.n * ZONES[c.z].ppl, 0);

  // ---------- Round context ----------
  function contextFor(S, baseRecord) {
    const k = S.k, record = S.record || baseRecord, fit = gumbelFit(record);
    const window = !!(S.last && S.last.maxDmg > 100);
    const homes = homesTotal(S);
    const maint = COST.maintFrac * S.leveeCap;
    const shareDmg = S.last ? Math.min(MONEY.councilShareCap, MONEY.councilShare * S.last.dmg) : 0;
    const H = clamp(HOUSING[k] * (1.2 - S.M / 100), 0.4, 2);
    return { k, year: ROUND_YEAR[k], record, fit1: fit.q(0.01), band: bootstrapQ(record, 0.01), window, H, supportStart: supportCarry(S.support, k),
      money: { tranche: MONEY.tranche[k], rates: homes * MONEY.ratesPerHome, carried: S.unspent, grant: window ? MONEY.recoveryGrant : 0, maint, share: shareDmg },
      horizons: HORIZONS[k], events: S.events || round1Events() };
  }
  function round1Events() {
    return [
      { id: "target", type: "info", icon: "home", title: "Council sets a housing target", text: "Up to 900 new homes on Hillside over the coming decades. Developers pay $15k per home approved now, $20k in later rounds as land values rise." },
      { id: "study", type: "info", icon: "chart", title: "Flood study: 1-in-100 flood at 7.1 m", text: "Based on 60 years of gauge record. The uncertainty band runs from about 6.2 to 7.9 m." },
      { id: "climate", type: "info", icon: "climate", title: "Climate change projections released", text: "Flood levels are projected to rise this century. How much depends on global emissions." },
    ];
  }

  // ---------- Plan from decisions ----------
  // d: { scen, hz, regional, align, lfb, spillway, basin, bridge, hill, hfb, rsBuy, rsRaise, retreat, code, warn, edu, route2, grants, wardens, trigger, consult }
  // h: herald choices { infill, maint, claim }
  function defaultDecisions(S, ctx) {
    return { scen: "none", hz: 1, regional: S.regional, align: S.align, lfb: 0.3, spillway: S.spillway, basin: S.basin, bridge: S.bridge,

function stations(rounds) {
  const em = { low: "Low", medium: "Medium", high: "High" };
  return rounds.map((R, k) => {
    const P = R.P, S = R.Sbefore, prev = k ? rounds[k - 1].P : null, st = { know: [], protect: [], plan: [], prepare: [], herald: [] };
    const add = (l, t, quiet, cls) => st[l].push({ t, quiet: !!quiet, cls });
    add("know", `Design ${P.DFL.toFixed(1)} m (${P.d.scen === "none" ? "no climate" : em[P.d.scen].toLowerCase()}, ${P.year})`, prev && prev.d.scen === P.d.scen && prev.d.hz === P.d.hz);
    if (P.d.regional && !S.regional) add("know", "Regional flood study");
    if (P.align !== "none") {
      if (S.align === "none") add("protect", `Levee: ${UW.ALIGN[P.align].label}, ${P.crest.toFixed(1)} m`);
      else if (P.align !== S.align) add("protect", `Levee extended: ${UW.ALIGN[P.align].label}, ${P.crest.toFixed(1)} m`);
      else if (P.crest > S.crest + 0.05) add("protect", `Levee raised to ${P.crest.toFixed(1)} m`);
      else add("protect", `Levee holds at ${P.crest.toFixed(1)} m`, true);
      if (P.crest < P.DFL - 0.05) add("protect", `${(P.DFL - P.crest).toFixed(1)} m below design flood`, false, "flag");
    }
    if (P.bridge && !S.bridge) add("protect", "Bridge raised");
    if (P.spillway && !S.spillway) add("protect", "Spillway");
    if (P.basin > S.basin) add("protect", `+${P.basin - S.basin} detention basin${P.basin - S.basin > 1 ? "s" : ""}`);
    if (P.newHill) add("plan", `+${fmt(P.newHill)} Hillside homes, floors ${P.hillFloor.toFixed(1)} m`);
    if (P.newBuy) add("plan", `Bought back ${P.newBuy} Riverside homes`);
    const nr = P.next.rsRaised - S.rsRaised; if (nr > 0) add("plan", `Raised ${nr} Riverside homes`);
    if (P.newRetreat) add("plan", `Retreat: ${P.newRetreat} suburban homes`);
    if (P.code && !S.code) add("plan", "Resilient building code");
    add("prepare", `Warnings level ${P.warn}`, prev && prev.warn === P.warn);
    if (P.trigger === "moderate") add("prepare", "Evacuate at moderate", prev && prev.trigger === "moderate");
    if (P.edu > 0) add("prepare", `Education $${P.edu}M`);
    if (P.route2 && !S.route2) add("prepare", "Second road out");
    if (P.d.grants > S.grants) add("prepare", `Resilience grants to ${P.d.grants}%`);
    if (P.wardens && !S.wardens) add("prepare", "Flood wardens");
    if (P.consult) add("prepare", "Consultation");
    const H = P.h || {}, has = id => (R.ctx.events || []).some(e => e.id === id);
    if (has("window")) add("herald", "Recovery funding window", true);
    if (has("infill")) add("herald", `Infill ${({ approve: "approved", raised: "approved, raised floors", refuse: "refused" })[H.infill] || "?"}`);
    if (has("maint")) add("herald", H.maint === "defer" ? "Maintenance deferred" : "Levee maintained");
    if (has("claim")) add("herald", H.claim === "contest" ? "Soggyton claim contested" : `Paid Soggyton ${fmtM(P.claimCost)}`);
    if (has("challenge")) add("herald", H.challenge === "relax" ? "Design standard relaxed" : "Held the design standard");
    return st;
  });
}

// ================= same decisions, different rivers =================
function trioHTML(plans, B, segs) {
  const order = ENS.map((_, i) => i).sort((x, y) => B.ev.dmg[x] - B.ev.dmg[y]);
  const pick = [["Mild", 0.1], ["Typical", 0.5], ["Severe", 0.9]].map(([n, q]) => [n, order[Math.floor(q * (order.length - 1))]]);
  return pick.map(([name, idx]) => {
    const fut = ENS[idx]; let dyn = { M: 30, A: 20, F: 0 }, dmg = 0, lives = 0, over = 0; const years = [];
    plans.forEach((P, k) => { const seg = UW.simSegment(P, fut, k, dyn); dyn = seg.dyn; dmg += seg.dmg + seg.nbr; lives += seg.lives; over += seg.nOver; years.push(...seg.years); });
    return `<div class="trio-card"><div class="row" style="justify-content:space-between"><b class="trio-name">${name} future</b><span class="small faint">#${idx + 1}</span></div>
      ${centurySVG(years, segs, { w: 480, h: 210, tick: 20 })}
      <div class="nums3"><div><b>${fmtM(dmg)}</b>damage<span>business as usual ${fmtM(B.ev.dmg[idx])}</span></div><div><b class="${lives ? "worse" : ""}">${lives}</b>lives lost</div><div><b>${plans[2].align === "none" ? "—" : over}</b>overtopped</div></div></div>`;
  }).join("");
}

const facCache = new Map();
function facGroup(name, F) {
  const code = FAC.codes[name], key = code + "|" + F;
  if (facCache.has(key)) return facCache.get(key);
  let v; try { const o = decodeCode(code); const useF = F || o.F; v = { name, o, F: useF, rp: useF ? UW.replay({ F: useF, r: o.r }, REC0, ENS) : null, ev: null }; } catch (e) { v = { name, err: true }; }
  facCache.set(key, v); return v;
}
function scatterSVG(pts) {
  const W = 860, H = 400, L = 58, R = 24, T = 18, B = 46;
  const xm = Math.max(...pts.map(p => p.x), 1) * 1.12, ym = Math.max(...pts.map(p => p.y), 0.5) * 1.18;
  const X = v => L + (W - L - R) * v / xm, Y = v => T + (H - T - B) * (1 - v / ym);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Damage against expected lives lost for each town" style="display:block">`;
  for (let i = 0; i <= 4; i++) { const xv = xm * i / 4, yv = ym * i / 4;
    s += `<line x1="${X(xv)}" y1="${T}" x2="${X(xv)}" y2="${H - B}" stroke="var(--line)"/><text x="${X(xv)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">$${fmt(xv)}M</text>`;
    s += `<line x1="${L}" y1="${Y(yv)}" x2="${W - R}" y2="${Y(yv)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(yv) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${yv.toFixed(1)}</text>`; }
  s += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--ink-2)">damage, average of 300 futures →</text><text x="14" y="${(T + H - B) / 2}" text-anchor="middle" font-size="12" fill="var(--ink-2)" transform="rotate(-90 14 ${(T + H - B) / 2})">expected lives lost →</text>`;
  s += `<text x="${L + 6}" y="${H - B - 8}" font-size="11.5" fill="var(--good)" font-weight="600">better ↙</text>`;
  for (const p of pts) { const r = 6 + 14 * Math.sqrt(p.size / 8000);
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${r.toFixed(1)}" fill="${p.col}" fill-opacity=".75" stroke="${p.bau ? "var(--ink)" : "var(--surface)"}" stroke-width="${p.bau ? 2 : 1.5}" ${p.bau ? 'stroke-dasharray="3 2"' : ""}/>`;
    const left = X(p.x) > W * 0.7; s += `<text x="${X(p.x) + (left ? -r - 4 : r + 4)}" y="${Y(p.y) + 4}" text-anchor="${left ? "end" : "start"}" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${esc(p.name)}</text>`; }
  return s + `</svg>`;
}

  if (!done.length) { body.innerHTML = `<div class="card"><h3>No finished towns yet</h3><p class="muted" style="margin-top:6px">Results appear once groups paste their Round 3 codes.</p></div>`; return; }
  for (const g of done) if (!g.ev) g.ev = evalPath(g.rp.rounds.map(r => r.P), g.rp.rounds.map(r => r.ctx));
  const rows = [...done.map(g => ({ name: g.name, S: g.rp.S, ev: g.ev })), { name: "Business as usual", S: B.rp.S, ev: B.ev, bau: true }].map(r => ({ ...r, cost: r.S.spent, dmg: r.ev.dmgMean, pll: r.ev.pll, housed: UW.peopleHoused(r.S), sup: r.S.support }));
  const dom = (p, q) => q.cost <= p.cost && q.dmg <= p.dmg && q.pll <= p.pll && q.housed >= p.housed && q.sup >= p.sup && (q.cost < p.cost || q.dmg < p.dmg || q.pll < p.pll || q.housed > p.housed || q.sup > p.sup);
  rows.forEach(r => r.pareto = !rows.some(q => q !== r && dom(r, q)));
  const best = { cost: Math.min(...rows.map(r => r.cost)), dmg: Math.min(...rows.map(r => r.dmg)), pll: Math.min(...rows.map(r => r.pll)), housed: Math.max(...rows.map(r => r.housed)), sup: Math.max(...rows.map(r => r.sup)) };
  const cell = (r, key, txt) => `<td class="n">${Math.abs(r[key] - best[key]) < 1e-6 ? `<b>${txt}</b>` : txt}</td>`;
  const mini = by => { const t = by.reduce((a, b) => a + b, 0) || 1; return `<div class="stack" style="height:10px;min-width:110px">${["know", "protect", "plan", "prepare"].map((k, i) => `<i style="width:${100 * by[i] / t}%;background:${LANES[k].col}"></i>`).join("")}</div>`; };
  body.innerHTML = `<div class="card"><h3>Results, future #${FAC.F}</h3><p class="small muted" style="margin:4px 0 10px">Damage and lives lost are averages over all 300 futures. Bold is best in column. A town on the Pareto front can't improve one score without losing another.</p>
    <div class="tablewrap"><table class="t"><thead><tr><th>Town</th><th class="n">Cost</th><th class="n">Damage</th><th class="n">Lives lost</th><th class="n">Housed</th><th class="n">Support</th><th>Spending mix</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr${r.bau ? ' class="bau"' : ""}><td><b>${esc(r.name)}</b></td>${cell(r, "cost", fmtM(r.cost))}${cell(r, "dmg", fmtM(r.dmg))}${cell(r, "pll", r.pll.toFixed(1))}${cell(r, "housed", fmt(Math.round(r.housed / 10) * 10))}${cell(r, "sup", r.sup)}<td>${mini(r.S.spentByLane)}</td><td>${r.pareto ? `<span class="pill gd">Pareto front</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="legend" style="margin-top:8px">${["know", "protect", "plan", "prepare"].map(k => `<span><i style="background:${LANES[k].col}"></i>${LANES[k].name}</span>`).join("")}</div></div>
    <div class="card" style="margin-top:16px"><h3>Damage against lives lost</h3><p class="small muted" style="margin:4px 0 8px">Bubble size: people housed. Colour: community support. Dashed outline: business as usual.</p>
      ${scatterSVG(rows.map(r => ({ name: r.name, x: r.dmg, y: r.pll, size: r.housed, col: supCol(r.sup), bau: r.bau })))}</div>
    <div class="card" style="margin-top:16px"><h3>Pathways</h3><div style="display:flex;flex-direction:column;gap:18px;margin-top:10px">${done.map(g => `<div><b style="font-family:var(--display);font-size:20px">${esc(g.name)}</b><div class="tablewrap" style="margin-top:6px">${pathwayHTML(g.rp)}</div></div>`).join("")}</div></div>`;
}

// ================= model notes =================
function notesHTML() {
  const fac = [["Starting point", "70, then carried over", "Round 1 starts at 70, a typical town's trust in council. Later periods start halfway between 70 and where support ended last period."], ["Levee on the skyline", "−2 per metre of crest above 6.5 m, per km", "Doubled if 20 years pass without a major flood."], ["Flood losses", "−1 per $40M of damage", "Capped at −20."], ["Lives lost", "−4 per life", "Capped at −25."], ["False alarms", "−1 each", "Evacuations for floods that flooded no homes. Capped at −10."], ["Buybacks and retreat", "−1 per 20 homes", "Halved in a recovery window."], ["Housing shortfall", "up to −12 × housing pressure", "Scaled by how much of the 900-home Hillside target is unbuilt."], ["Infill refused", "−6 × housing pressure", "Only when the Herald offers infill."], ["Rates and spending", "−1 per $4M above $40M", "Spending in a round."], ["Dispute with Soggyton", "−8 if paid, −14 if contested", "When a compensation claim arrives."], ["Farmland for basins", "−2 per basin", ""], ["Held a high standard", "−6", "When developers challenge your design flood and you hold."], ["Consultation", "+8", "Also lifts council approval."], ["Education campaign", "+0.6 per $1M", ""], ["Rebuilding after disaster", "+10", "Spending $15M+ on Protect and Plan in a recovery window."], ["Cut corners on maintenance", "−10", "Levee overtopped after maintenance was deferred."]];
  return `<div class="eyebrow">For teachers and the curious</div><h2>How the model works</h2>
  <p>Underwaterville is a teaching model, not a flood study. Every number below is invented to be plausible for a temperate Victorian river town, and tuned so that no single strategy wins every score.</p>
  <h3>The river nobody can see</h3>
  <p>Each future is 100 years of annual flood peaks at the town gauge. Peaks come from a generalised extreme value distribution, with wet and dry regimes that persist for years (like La Niña and El Niño runs). Climate drift differs between futures: typical floods get slightly smaller while the biggest floods get bigger. There are 300 futures, from mild to severe. In class, everyone lives through the same one, picked by the future number. Scores average over all 300, so luck doesn't decide them.</p>
  <h3>Your flood study</h3>
  <p>The study fits a Gumbel curve to the gauge record (60 years at the start, growing as you live through more) and reads off the 1-in-100 flood. The band is a bootstrap 90% range. Your <b>design flood</b> is that estimate plus 0.4 m if you commission the regional study, plus the climate change projection for your chosen emissions path and year. Projections are revised up 15% in Round 2 and 30% in Round 3.</p>
  <p>The forecast in the money bar runs your plan through 100 imaginary futures drawn from your own study. At the end, you see how that compared with the real river.</p>
  <h3>Damage</h3>
  <p>Each group of homes floods to the depth of water above its floor. Damage is a share of property value: 20% plus 30% per metre of depth, capped at 75%. Resilient homes (grants or the building code) take 35% less. When a levee is overtopped, water is trapped behind it: damage is 25% worse, or 5% worse with a spillway. A levee pushes water onto Riverside and downstream: Soggyton's damage grows with levee length, crest height and flood size.</p>
  <h3>Lives lost</h3>
  <p>Expected lives lost = people in flooded homes × share not evacuated × a loss-of-life rate. The rate is 0.015% in ordinary flooding, rising to 1.4× above 1 m and 2× above 2 m deep. Behind an overtopped levee it is eight times higher (water arrives fast and deep), cut by 60% with a spillway.</p>
  <p>People evacuate only if the warning reaches them in time (the warning system's reliability, worse when the flood exceeds your design flood), they choose to go (awareness, flood memory and wardens; fewer leave from behind tall levees) and they can get out (the bridge closes above its deck unless you raise it or build a second road). In the live future, the number of lives lost is drawn at random from these expectations.</p>
  <h3>People</h3>
  <p><b>Flood memory</b> jumps after damaging floods and lives lost, then fades by 7% a year (halving about every 10 years). Floods where lives are lost or the levee is overtopped also leave a lasting floor that halves only every 25 years, so memory of a disaster lasts about a generation. This follows evidence that flood memory has a fast, word-of-mouth part and a slower part, and shapes behaviour for roughly one generation (Song et al. 2021, <i>Journal of Flood Risk Management</i>; Fanta et al. 2019, <i>Nature Communications</i>). <b>Awareness</b> fades the same way and is topped up by education spending. Low memory raises <b>housing pressure</b> and lowers council approval.</p>
  <h3>Money and council</h3>
  <p>Each round: a council tranche ($50M, then $30M, $30M), $10k of rates per home, savings from last round, developer contributions per new home ($15k in Round 1, $20k after; 25% less under the building code), a $10M recovery grant after a $100M flood year. Out: levee maintenance (8% of levee value per round, unless deferred), council's share of flood recovery and any Soggyton claim. Council approves 35% + 0.5% per support point + 0.4% per memory point of the money available (40–100%), and 15% less again if support is under 40.</p>
  <h3>Community support</h3>
  <div class="tablewrap"><table class="t"><thead><tr><th>Factor</th><th>Effect</th><th>Notes</th></tr></thead><tbody>${fac.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join("")}</tbody></table></div>
  <p>Support is clamped to 0–100. Each period starts halfway between 70 and where support ended last period, so trust partly recovers (new councillors, new residents) but a bad period still follows you.</p>
  <h3>The Herald</h3>
  <p>Stories appear when their conditions are met: recovery funding after a $100M flood year (buybacks, raising and retreat at half price), an inquiry after lives are lost, infill offers when a levee held or the river was quiet, deferral of maintenance and complaints about the wall after 20 quiet years, a developer challenge to high design standards, a Soggyton claim when downstream damage tops $30M, and revised climate change projections every round.</p>
  <h3>Business as usual</h3>
  <p>A centre-and-suburbs levee 0.3 m above a design flood that ignores climate change, all 900 Hillside homes with 0.3 m freeboard, basic warnings, every development approved, maintenance deferred and claims paid. Scores compare your pathway with this town in the same future.</p>
  <h3>What's left out</h3>
  <ul><li>One river, one gauge, no flash flooding, storm surge or dam operations.</li><li>Instant warnings and evacuations; no traffic, no time of day.</li><li>No insurance, no discounting of future costs, no inflation.</li><li>Levees fail only by overtopping, never by breach or seepage.</li><li>Support and council approval are simple formulas standing in for real politics.</li></ul>`;
}

// ================= tabs + boot =================
const TABS = ["town", "howto", "play", "fac", "notes"];
const tours = {};
function showTab(t, noScroll) {
  if (!TABS.includes(t)) t = "town";
  TABS.forEach(x => { $("tab-" + x).hidden = x !== t; });
  document.querySelectorAll(".tabbtn").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  store.set("uw3-tab", t);
  if (t === "play" && !playInit) renderPlay();
  if (t === "fac") renderFac();
  if (!noScroll) window.scrollTo(0, 0);
}
document.querySelectorAll(".tabbtn").forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("[data-tabgo]"); if (a) { e.preventDefault(); showTab(a.dataset.tabgo); } });
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target && e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select") return;
  const cur = TABS.find(x => !$("tab-" + x).hidden);
  if (cur !== "town" && cur !== "howto") return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); tours[cur].step(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); tours[cur].step(-1); }
});
tours.town = makeTour("tourTown", TOUR_TOWN, "uw3-tour-town");
tours.howto = makeTour("tourHow", TOUR_HOW, "uw3-tour-how");
$("notes").innerHTML = notesHTML();
let startTab = store.get("uw3-tab") || "town";
try { const h = (location.hash || "").replace("#", ""); if (TABS.includes(h)) startTab = h; } catch (e) { }
showTab(startTab, true);
})();


</script>
